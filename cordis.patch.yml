# dsh-ghCLI bundle patch: inserts the dual-face plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base; activate with
# `dsh plugin --profile <name> add <此目录绝对路径> -w`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (gh/git engine + /api/dsh-ghcli routes), and the `dsh.client`
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/dsh-ghcli/client.js) load in the web GUI.
- insert:
    - id: ghcli
      name: 'dsh-ghcli'
